controller:
  service:
    type: NodePort
    nodePorts:
      http: 30080
      https: 30443
  
  # Add resource limits for stability
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  
  # Enable metrics for monitoring
  metrics:
    enabled: true
    service:
      port: 10254
  
  ingressClassResource:
    name: nginx
    enabled: true
    default: true
  
  # Add logging
  config:
    log-format-upstream: '$proxy_protocol_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"'