# Kafka cluster configuration
kafka:
  # Set replicas to 2 for dev environment (3 ideal for production)
  replicas: 2
  
  # Configure storage
  storage:
    type: persistent-claim
    size: 5Gi
    class: local-path
  
  # Configure listeners for different access patterns
  listeners:
    - name: plain
      port: 9092
      type: internal
      tls: false
    
    - name: external
      port: 30992
      type: nodeport
      tls: false
  
  # Add resource limits
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  
  # JVM settings
  jvmOptions:
    "-Xms": "256m"
    "-Xmx": "512m"
  
  # Logging configuration
  logging:
    type: inline
    loggers:
      kafka.root.logger.level: "INFO"

# ZooKeeper configuration
zookeeper:
  # Set replicas to 2 for dev environment (3 ideal for production)
  replicas: 2
  
  storage:
    type: persistent-claim
    size: 2Gi
    class: local-path
  
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 125m
      memory: 128Mi

# Entity Operator (for topic and user management)
entityOperator:
  topicOperator:
    logging:
      type: inline
      loggers:
        rootLogger.level: "INFO"
    resources:
      limits:
        cpu: 200m
        memory: 128Mi
      requests:
        cpu: 100m
        memory: 64Mi
  
  userOperator:
    logging:
      type: inline
      loggers:
        rootLogger.level: "INFO"
    resources:
      limits:
        cpu: 200m
        memory: 128Mi
      requests:
        cpu: 100m
        memory: 64Mi