apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: kafka-cluster
  namespace: kafka

spec:
  kafka:
    version: 4.2.0
    replicas: 2

    listeners:
      # 🔹 Internal communication
      - name: internal
        port: 9092
        type: internal
        tls: false

      # 🔹 External access (from your laptop)
      - name: external
        port: 9094
        type: nodeport
        tls: false

    config:
      offsets.topic.replication.factor: 2
      transaction.state.log.replication.factor: 2
      transaction.state.log.min.isr: 1
      auto.create.topics.enable: false

    storage:
      type: persistent-claim
      size: 5Gi
      deleteClaim: false

  zookeeper:
    replicas: 1   # keep lightweight for local
    storage:
      type: persistent-claim
      size: 2Gi
      deleteClaim: false

  entityOperator:
    topicOperator: {}
    userOperator: {}