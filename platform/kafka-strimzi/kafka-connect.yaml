apiVersion: kafka.strimzi.io/v1
kind: KafkaConnect
metadata:
  name: kafka-connect
  namespace: kafka
  annotations:
    strimzi.io/use-connector-resources: "true"

spec:
  version: 3.6.0
  replicas: 1

  bootstrapServers: kafka-cluster-kafka-bootstrap:9092

  groupId: connect-cluster
  offsetStorageTopic: connect-offsets
  configStorageTopic: connect-configs
  statusStorageTopic: connect-status

  offsetStorageReplicationFactor: 2
  configStorageReplicationFactor: 2
  statusStorageReplicationFactor: 2

  config:
    # Converters
    key.converter: org.apache.kafka.connect.json.JsonConverter
    value.converter: org.apache.kafka.connect.json.JsonConverter
    key.converter.schemas.enable: false
    value.converter.schemas.enable: false

  resources:
    requests:
      memory: 512Mi
      cpu: "0.5"
    limits:
      memory: 1Gi
      cpu: "1"

  logging:
    type: inline
    loggers:
      log4j.rootLogger: "INFO"