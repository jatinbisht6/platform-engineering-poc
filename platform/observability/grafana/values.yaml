service:
  type: NodePort
  nodePort: 32044

# Set admin credentials
adminPassword: "GrafanaDevPassword123!"

# Configure persistent storage
persistence:
  enabled: true
  size: 2Gi
  storageClassName: local-path

# Add resource limits
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

# Increase probe timeouts for initialization
containers:
  grafana:
    readinessProbe:
      initialDelaySeconds: 30
      timeoutSeconds: 5
      periodSeconds: 10
      failureThreshold: 5
    livenessProbe:
      initialDelaySeconds: 60
      timeoutSeconds: 30
      periodSeconds: 10
      failureThreshold: 10

# Configure Prometheus datasource automatically
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus-server:32090
        access: proxy
        isDefault: true

# Add pod labels
podLabels:
  app: grafana
  tier: observability